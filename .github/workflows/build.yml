name: Build Docker images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BASE_IMAGE: ghcr.io/gclems/okaeri-laravel-base
  APP_IMAGE: ghcr.io/${{ github.repository }}

jobs:

  # ==========================================================
  # Detect whether the base image needs rebuilding
  # ==========================================================

  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest

    outputs:
      base_changed: ${{ steps.filter.outputs.base }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect base changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            base:
              - 'Dockerfile.base'

      - name: Show result
        run: |
          echo "Base image changed: ${{ steps.filter.outputs.base }}"


  # ==========================================================
  # Build base image
  # ==========================================================

  build-base:
    name: Build base image
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.base_changed == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.base
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.BASE_IMAGE }}:php8.5
            ${{ env.BASE_IMAGE }}:latest
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base


  # ==========================================================
  # Build application image
  # ==========================================================

  build-okaeri:
    name: Build Okaeri image
    needs:
      - detect-changes
      - build-base
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      (
        needs.build-base.result == 'success' ||
        needs.build-base.result == 'skipped'
      )
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.APP_IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Okaeri image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=okaeri
          cache-to: type=gha,mode=max,scope=okaeri
          provenance: true
          sbom: true

  # ==========================================================
  # Deploy to home server
  # ==========================================================

  deploy:
    name: Deploy to homeserver
    needs:
      - build-okaeri

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: homeserver

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' '${{ secrets.SSH_PRIVATE_KEY }}' > ~/.ssh/okaeri-deploy
          chmod 600 ~/.ssh/okaeri-deploy

          ssh-keyscan -H homeserver >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          OKAERI_IMAGE: ghcr.io/gclems/okaeri-laravel:${{ github.sha }}
        run: |
          ssh -i ~/.ssh/okaeri-deploy homeserver \
            "OKAERI_IMAGE='${OKAERI_IMAGE}' docker compose \
              -f ~/Projects/homeserver/compose.yaml \
              pull okaeri reverb scheduler ha-listener unify-listener"

          ssh -i ~/.ssh/okaeri-deploy homeserver \
            "OKAERI_IMAGE='${OKAERI_IMAGE}' docker compose \
              -f ~/Projects/homeserver/compose.yaml \
              stop okaeri reverb scheduler ha-listener unify-listener"

          ssh -i ~/.ssh/okaeri-deploy homeserver \
            "OKAERI_IMAGE='${OKAERI_IMAGE}' docker compose \
              -f ~/Projects/homeserver/compose.yaml \
              run --rm --no-deps okaeri php artisan migrate --force"

          ssh -i ~/.ssh/okaeri-deploy homeserver \
            "OKAERI_IMAGE='${OKAERI_IMAGE}' docker compose \
              -f ~/Projects/homeserver/compose.yaml \
              up -d okaeri reverb scheduler ha-listener unify-listener"

      - name: Wait for services
        run: |
          ssh -i ~/.ssh/okaeri-deploy homeserver '
            set -e

            services=(
              okaeri
              okaeri-reverb
              okaeri-scheduler
              okaeri-ha-listener
              okaeri-unify-listener
            )

            for i in {1..30}; do
              all_healthy=true

              for service in "${services[@]}"; do
                status=$(docker inspect \
                  --format "{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}" \
                  "$service" 2>/dev/null || echo "missing")

                echo "$service: $status"

                if [ "$status" != "healthy" ]; then
                  all_healthy=false
                fi
              done

              if [ "$all_healthy" = true ]; then
                echo "All Okaeri services are healthy."
                exit 0
              fi

              echo "Waiting for services..."
              sleep 5
            done

            echo "Deployment failed: services did not become healthy."
            docker compose \
              -f ~/Projects/homeserver/compose.yaml \
              ps

            docker compose \
              -f ~/Projects/homeserver/compose.yaml \
              logs --tail=100 \
              okaeri reverb scheduler ha-listener unify-listener

            exit 1
          '
