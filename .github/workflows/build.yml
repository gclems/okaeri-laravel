name: Build Docker images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BASE_IMAGE: ghcr.io/gclems/okaeri-laravel-base
  APP_IMAGE: ghcr.io/${{ github.repository }}

jobs:

  # ==========================================================
  # Detect whether the base image needs rebuilding
  # ==========================================================

  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest

    outputs:
      base_changed: ${{ steps.filter.outputs.base }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect base changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            base:
              - 'Dockerfile.base'

      - name: Show result
        run: |
          echo "Base image changed: ${{ steps.filter.outputs.base }}"


  # ==========================================================
  # Build base image
  # ==========================================================

  build-base:
    name: Build base image
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.base_changed == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.base
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.BASE_IMAGE }}:php8.5
            ${{ env.BASE_IMAGE }}:latest
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base


  # ==========================================================
  # Build application image
  # ==========================================================

  build-okaeri:
    name: Build Okaeri image
    needs:
      - detect-changes
      - build-base
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      (
        needs.build-base.result == 'success' ||
        needs.build-base.result == 'skipped'
      )
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.APP_IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Okaeri image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=okaeri
          cache-to: type=gha,mode=max,scope=okaeri
          provenance: true
          sbom: true
